<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      ✅ Thymeleaf: templates/layout/default.html (기본 레이아웃)
      ✅ React:     index.html → 단 하나의 HTML 파일 (SPA 진입점)
      
      Thymeleaf는 서버가 HTML을 완성해서 보내줌
      React는 브라우저가 JS로 HTML을 직접 그림 (CSR)
    -->
    <title>Day 01 - React 시작하기</title>
  </head>
  <body>
    <!--
      ✅ Thymeleaf: <div th:replace="~{fragments/content}">
      ✅ React:     <div id="root"> → JS가 이 안을 채워 넣음
    -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
