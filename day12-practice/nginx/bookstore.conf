# nginx/bookstore.conf
# ✏️ 도전 과제 ④: Docker로 로컬 테스트 시 사용
#
# 사용법:
#   docker run -p 80:80 \
#     -v $(pwd)/dist:/var/www/bookstore/dist \
#     -v $(pwd)/nginx/bookstore.conf:/etc/nginx/conf.d/default.conf \
#     nginx:alpine

server {
    listen 80;
    server_name localhost;   # 운영: bookstore.com 으로 변경

    # ── React SPA 정적 파일 ───────────────────────────────
    root  /var/www/bookstore/dist;
    index index.html;

    # ✏️ SPA 핵심 설정
    # /books/3, /cart 새로고침 시 Nginx는 해당 파일이 없으므로
    # index.html 반환 → React Router가 클라이언트에서 라우팅 처리
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── 정적 자산 캐싱 ────────────────────────────────────
    # Vite 빌드 결과: assets/index-AbcXyz.js (파일명에 해시 포함)
    # → 파일 변경 시 URL이 바뀌므로 1년 캐싱 안전
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Spring Boot API 프록시 ────────────────────────────
    # ✏️ Thymeleaf: 없음 (같은 서버에서 처리)
    #    React: 분리된 서버이므로 CORS 없이 프록시로 처리
    location /api/ {
        proxy_pass         http://host.docker.internal:8080;  # 로컬 테스트용
        # proxy_pass       http://localhost:8080;             # 서버 배포 시
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── 에러 페이지 ───────────────────────────────────────
    error_page 404 /index.html;  # SPA: 404도 React Router가 처리
}
